<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Messages</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

<div class="container">

    <h1 class="section-title">📩 Contact Messages</h1>

    <div class="message-grid">

        {% for msg in messages %}

        <div class="message-card">

            <h2>{{ msg.name }}</h2>

            <h3>{{ msg.email }}</h3>

            <p>{{ msg.message }}</p>

            <a href="{{ url_for('delete_message', id=msg.id) }}"
               class="delete-btn"
               onclick="return confirm('Delete this message?')">

                🗑 Delete

            </a>

        </div>

        {% endfor %}

    </div>

</div>

</body>
</html>
